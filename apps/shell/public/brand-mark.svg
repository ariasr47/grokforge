<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none" role="img" aria-hidden="true">
  <defs>
    <linearGradient id="aeonCore" x1="14" y1="10" x2="52" y2="54" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#b8fff4"/>
      <stop offset="38%" stop-color="#7dffe8"/>
      <stop offset="72%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#c4b5fd"/>
    </linearGradient>
    <radialGradient id="aeonSheen" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(24 20) rotate(55) scale(28 22)">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.85"/>
      <stop offset="45%" stop-color="#ffffff" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="aeonGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="2.2" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Soft halo -->
  <ellipse cx="32" cy="34" rx="22" ry="24" fill="#7dffe8" opacity="0.12"/>
  <ellipse cx="32" cy="34" rx="18" ry="20" fill="#c4b5fd" opacity="0.1"/>
  <!-- Living nucleus: teardrop-orb hybrid (Aeon mark) -->
  <path
    filter="url(#aeonGlow)"
    fill="url(#aeonCore)"
    d="M32 8
       C42 8 52 18 52 30
       C52 44 40 54 32 56
       C24 54 12 44 12 30
       C12 18 22 8 32 8Z"
  />
  <!-- Inner fluid wave -->
  <path
    fill="#c4b5fd"
    opacity="0.35"
    d="M18 34
       C22 28 28 30 32 33
       C36 36 42 38 48 34
       C48 44 40 52 32 53.5
       C24 52 16 44 16 34
       C16.5 34 17 34 18 34Z"
  />
  <!-- Specular -->
  <ellipse cx="25" cy="22" rx="7" ry="5" fill="url(#aeonSheen)" transform="rotate(-28 25 22)"/>
  <path
    stroke="#ffffff"
    stroke-opacity="0.45"
    stroke-width="1.2"
    stroke-linecap="round"
    d="M22 18 C26 14 34 13 40 17"
  />
</svg>
